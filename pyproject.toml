[project]
name = "spillway-forecast"
version = "0.1.0"
description = "Hourly risk forecast of wind/solar curtailment (ONS) with honest temporal validation, MLflow and a FastAPI service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "holidays>=0.107",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "polars>=2.1.0",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
warehouse = [
    "psycopg[binary]>=3.3.6",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[project.scripts]
spillway = "spillway_forecast.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "DTZ"]
ignore = ["DTZ011"]  # naive calendar dates are intended (ONS data is in local time)

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
module = ["mlflow", "mlflow.*", "sklearn", "sklearn.*", "matplotlib", "matplotlib.*", "holidays", "joblib"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
